# Weekly dependency refresh.
#
# Bumps dependencies within the current major version, runs the full test
# gate, and on success commits the result and pushes the next minor tag.
# The tag push is what triggers ci.yml, which builds the image and cuts the
# GitHub release — so the push MUST use a PAT. A tag pushed with the default
# GITHUB_TOKEN does not start another workflow run, which would leave the tag
# dangling with no image and no release.
#
# Required repository secret:
#   RELEASE_PAT  fine-grained PAT for this repo with Contents: read & write
name: deps-update

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT is not set. A tag pushed with GITHUB_TOKEN does not trigger ci.yml, so no image or release would be produced."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # --- language-specific bump ---------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bump npm dependencies
        run: |
          npx --yes npm-check-updates --upgrade --target minor
          npm install

      - name: Detect changes
        id: changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies already current; nothing to do."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package.json package-lock.json
          fi

      # --- language-specific test gate, mirroring ci.yml ----------------
      - name: Lint
        if: steps.changed.outputs.any == 'true'
        run: npm run lint

      - name: Build
        if: steps.changed.outputs.any == 'true'
        run: npm run build

      # --- shared release path ------------------------------------------
      - name: Work out the next minor version
        if: steps.changed.outputs.any == 'true'
        id: version
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next='v0.1.0'
          else
            ver=${latest#v}
            major=$(echo "$ver" | cut -d. -f1)
            minor=$(echo "$ver" | cut -d. -f2)
            next="v${major:-0}.$(( ${minor:-0} + 1 )).0"
          fi
          echo "Latest tag: ${latest:-<none>} -> next: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      # Keeps package.json in step with the git tag, which had drifted.
      - name: Sync package.json version
        if: steps.changed.outputs.any == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: npm version "${NEXT#v}" --no-git-tag-version --allow-same-version

      - name: Commit and tag
        if: steps.changed.outputs.any == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(deps): weekly dependency update for ${NEXT}"
          git tag -a "$NEXT" -m "$NEXT"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "refs/tags/$NEXT"

      - name: Summary
        if: always()
        env:
          ANY: ${{ steps.changed.outputs.any }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if [ "$ANY" = 'true' ]; then
            echo "Dependencies updated and tagged **${NEXT}**; ci.yml takes over from here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No dependency updates available.' >> "$GITHUB_STEP_SUMMARY"
          fi
